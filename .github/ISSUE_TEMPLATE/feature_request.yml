name: 功能建议
description: 提出一个新功能或改进
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说场景与痛点，再说方案
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的方案
    validations:
      required: false
  - type: textarea
    id: alt
    attributes:
      label: 考虑过的其它方案
    validations:
      required: false
