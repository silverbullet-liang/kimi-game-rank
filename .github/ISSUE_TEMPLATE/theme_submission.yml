name: 主题投稿
description: 提交一套自己做的主题，评审通过后收进正式目录
title: "[主题] "
labels: ["theme"]
body:
  - type: markdown
    attributes:
      value: |
        投稿前请先看 [主题规范](../themes/SPEC.md)，并本地跑一次：
        ```
        python3 tools/theme_check.py 你的主题.json
        ```
        通过的会进评审，不通过会被退回并说明原因。

  - type: input
    id: theme-name
    attributes:
      label: 主题名称
      description: 与 JSON 里的 name 一致
      placeholder: 星空
    validations:
      required: true

  - type: textarea
    id: theme-json
    attributes:
      label: 主题 JSON
      description: 直接贴完整 JSON；太长可改为下方「文件链接」
      render: json
    validations:
      required: false

  - type: input
    id: theme-link
    attributes:
      label: 文件链接（可选）
      description: 如果 JSON 很长，给一个可下载链接（https）
      placeholder: https://example.com/my-theme.json
    validations:
      required: false

  - type: input
    id: preview
    attributes:
      label: 预览截图
      description: 至少一张首页截图（浅色或深色均可），能看清背景、圆角与主色
      placeholder: https://example.com/preview.png
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 一句话说明
      description: 这套主题想表达什么，或者灵感来自哪里
    validations:
      required: true

  - type: dropdown
    id: force
    attributes:
      label: 明暗模式
      options:
        - 不强制（auto）
        - 仅浅色（light）
        - 仅深色（dark）
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认项
      options:
        - label: 我确认这份 JSON 在本地通过了 theme_check.py
          required: true
        - label: 我同意以 AGPL-3.0 授权本站收录与分发这套主题
          required: true
        - label: 主题内使用的图片与字体，我有权使用或已注明来源
          required: true
